<!-- A favicon is just an image. An SVG is sharp at every size and weighs nothing.
     Change the two letters and the two colours; that is the whole file. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <rect width="64" height="64" rx="14" fill="#2f45c5"/>
  <text x="32" y="42"
        font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
        font-size="28" font-weight="700"
        fill="#ffffff" text-anchor="middle">JH</text>
</svg>
